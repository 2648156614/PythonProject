{% extends "base.html" %}

{% block title %}编辑学生信息{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-pencil-square me-2"></i>编辑学生信息</h2>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回管理后台
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">账号</label>
                    <input class="form-control" value="{{ student.username }}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">姓名</label>
                    <input class="form-control" name="name" value="{{ student.name or '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">专业</label>
                    <input class="form-control" name="major" value="{{ student.major or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">班级</label>
                    <input class="form-control" name="class_name" value="{{ student.class_name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">所属教师</label>
                    <select class="form-select" name="teacher_id" required>
                        <option value="">请选择教师</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" {% if student.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2-circle"></i> 保存修改
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
